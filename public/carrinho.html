<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carrinho — Estalise</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<script>
/* Animação de entrada: só na 1ª visita da sessão ou ao atualizar (F5) */
(function () {
  try {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
    var recarregou = nav && nav.type === "reload";
    var primeiraVisita = !sessionStorage.getItem("estalise_intro");
    if (!recarregou && !primeiraVisita) return;
    sessionStorage.setItem("estalise_intro", "1");
    var html = document.documentElement;
    html.classList.add("intro");
    window.finalizarIntro = function () {
      html.classList.add("intro-feita");
      html.classList.remove("intro");
    };
    // Segurança: se os scripts demorarem muito, encerra a intro mesmo assim.
    setTimeout(window.finalizarIntro, 8000);
  } catch (e) {}
})();
</script>
</head>
<body>

<div id="site-header"></div>

<div class="container">
  <h1 class="page-title">Carrinho</h1>

  <div id="auth-gate" class="auth-gate" hidden>
    <h3>Faça login para acessar o carrinho</h3>
    <p style="color:var(--gray);font-size:14px;margin:0">Entre na sua conta para ver seus itens.</p>
    <div class="auth-actions">
      <a class="btn btn-primary btn-block" href="login.html?redirect=carrinho.html">Entrar</a>
      <a class="btn btn-secondary btn-block" href="cadastro.html?redirect=carrinho.html">Criar Conta</a>
    </div>
  </div>

  <div class="cart-layout" id="cart-layout">
    <div id="lista-carrinho"></div>
    <div id="resumo-carrinho"></div>
  </div>
</div>

<div id="site-footer" class="site-footer"></div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

<script src="js/config.js"></script>
<script src="js/firebaseClient.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/cartPage.js"></script>

<script>
  renderLayout("carrinho");

  auth.onAuthStateChanged((user) => {
    const authGate = document.getElementById("auth-gate");
    const cartLayout = document.getElementById("cart-layout");

    if (!user) {
      authGate.hidden = false;
      cartLayout.hidden = true;
      return;
    }

    authGate.hidden = true;
    cartLayout.hidden = false;
    renderizarCarrinho();
  });
</script>
</body>
</html>
