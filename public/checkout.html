<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — Estalise</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<script>
/* Animação de entrada: só na 1ª visita da sessão ou ao atualizar (F5) */
(function () {
  try {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
    var recarregou = nav && nav.type === "reload";
    var primeiraVisita = !sessionStorage.getItem("estalise_intro");
    if (!recarregou && !primeiraVisita) return;
    sessionStorage.setItem("estalise_intro", "1");
    var html = document.documentElement;
    html.classList.add("intro");
    window.finalizarIntro = function () {
      html.classList.add("intro-feita");
      html.classList.remove("intro");
    };
    // Segurança: se os scripts demorarem muito, encerra a intro mesmo assim.
    setTimeout(window.finalizarIntro, 8000);
  } catch (e) {}
})();
</script>
</head>
<body>

<div id="site-header"></div>

<div class="container">
  <h1 class="page-title">Checkout</h1>

  <div class="cart-layout">
    <form id="form-checkout" onsubmit="finalizarPedido(event)">
      <h3 style="margin-bottom:20px">Endereço de entrega</h3>

      <div class="form-group">
        <label>CEP</label>
        <input type="text" id="cep-endereco" class="field" required maxlength="9" />
      </div>
      <div class="form-group">
        <label>Logradouro</label>
        <input type="text" id="logradouro" class="field" required />
      </div>
      <div class="flex gap-8">
        <div class="form-group" style="flex:1">
          <label>Número</label>
          <input type="text" id="numero" class="field" required />
        </div>
        <div class="form-group" style="flex:2">
          <label>Complemento</label>
          <input type="text" id="complemento" class="field" />
        </div>
      </div>
      <div class="form-group">
        <label>Bairro</label>
        <input type="text" id="bairro" class="field" required />
      </div>
      <div class="flex gap-8">
        <div class="form-group" style="flex:2">
          <label>Cidade</label>
          <input type="text" id="cidade" class="field" required />
        </div>
        <div class="form-group" style="flex:1">
          <label>UF</label>
          <input type="text" id="uf" class="field" maxlength="2" required />
        </div>
      </div>

      <h3 style="margin:28px 0 12px">Forma de pagamento</h3>
      <div class="summary-box" style="display:flex;align-items:center;gap:12px;margin-bottom:20px;border:1px solid var(--success)">
        <span style="font-size:22px">💳</span>
        <div>
          <strong>Pix ou cartão de crédito</strong>
          <div style="color:var(--gray);font-size:12px">Pagamento confirmado automaticamente.</div>
        </div>
      </div>

      <button id="btn-finalizar" type="submit" class="btn btn-primary btn-block">Ir para o pagamento</button>
      <p id="checkout-msg" class="form-msg"></p>
      <p style="color:var(--gray);font-size:12px;margin-top:12px">Você será levado à página segura da InfinitePay. Lá você escolhe pagar com <strong>Pix</strong> ou <strong>cartão de crédito</strong>.</p>
    </form>

    <div id="resumo-checkout"></div>
  </div>
</div>

<div id="site-footer" class="site-footer"></div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

<script src="js/config.js"></script>
<script src="js/firebaseClient.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/checkout.js"></script>

<script>
document.addEventListener(
  "DOMContentLoaded",
  () => {
    renderLayout("carrinho");
    initCheckout();
  }
);
</script>
</body>
</html>
