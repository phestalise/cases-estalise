<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minha Conta — Estalise</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<script>
/* Animação de entrada: só na 1ª visita da sessão ou ao atualizar (F5) */
(function () {
  try {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
    var recarregou = nav && nav.type === "reload";
    var primeiraVisita = !sessionStorage.getItem("estalise_intro");
    if (!recarregou && !primeiraVisita) return;
    sessionStorage.setItem("estalise_intro", "1");
    var html = document.documentElement;
    html.classList.add("intro");
    window.finalizarIntro = function () {
      html.classList.add("intro-feita");
      html.classList.remove("intro");
    };
    // Segurança: se os scripts demorarem muito, encerra a intro mesmo assim.
    setTimeout(window.finalizarIntro, 8000);
  } catch (e) {}
})();
</script>
</head>
<body>

<div id="site-header"></div>

<div class="container" style="padding:60px 24px">
  <div class="section-head">
    <div>
      <h1 id="perfil-nome">Minha conta</h1>
      <p style="color:var(--gray)" id="perfil-email"></p>
    </div>
    <button class="btn btn-outline" onclick="handleLogout()">Sair</button>
  </div>

  <hr class="stitch" />

  <h2 style="margin-bottom:20px">Meus dados</h2>
  <div class="perfil-grid conta-dados">
    <div class="summary-box">
      <h3 style="margin-bottom:16px">Dados pessoais</h3>
      <div class="form-group"><label>Nome completo</label><input id="meus-nome" class="field" autocomplete="name" /></div>
      <div class="flex gap-8" style="flex-wrap:wrap">
        <div class="form-group" style="flex:1;min-width:150px"><label>Telefone</label><input id="meus-telefone" class="field" inputmode="tel" autocomplete="tel" placeholder="(11) 99999-9999" /></div>
        <div class="form-group" style="flex:1;min-width:150px"><label>CPF</label><input id="meus-cpf" class="field" disabled /></div>
      </div>
      <button class="btn btn-primary" onclick="salvarMeusDados()">Salvar dados</button>
      <p id="meus-dados-msg" class="form-msg"></p>
    </div>

    <div class="summary-box">
      <h3 style="margin-bottom:16px">E-mail</h3>
      <div class="form-group"><label>E-mail atual</label><input id="meus-email" class="field" disabled /></div>
      <div class="form-group"><label>Novo e-mail</label><input id="meus-novo-email" type="email" class="field" autocomplete="email" placeholder="novo@email.com" /></div>
      <div class="form-group"><label>Senha atual (para confirmar)</label><input id="meus-senha-email" type="password" class="field" autocomplete="current-password" /></div>
      <button class="btn btn-outline" onclick="trocarMeuEmail()">Trocar e-mail</button>
      <p id="meus-email-msg" class="form-msg"></p>
    </div>

    <div class="summary-box">
      <h3 style="margin-bottom:16px">Senha</h3>
      <div class="form-group"><label>Senha atual</label><input id="minha-senha-atual" type="password" class="field" autocomplete="current-password" /></div>
      <div class="flex gap-8" style="flex-wrap:wrap">
        <div class="form-group" style="flex:1;min-width:150px"><label>Nova senha</label><input id="minha-senha-nova" type="password" class="field" autocomplete="new-password" /></div>
        <div class="form-group" style="flex:1;min-width:150px"><label>Repita a nova senha</label><input id="minha-senha-nova2" type="password" class="field" autocomplete="new-password" /></div>
      </div>
      <div class="flex gap-8" style="flex-wrap:wrap">
        <button class="btn btn-outline" onclick="trocarMinhaSenha()">Trocar senha</button>
        <button class="btn btn-ghost" onclick="enviarLinkMinhaSenha()">Esqueci minha senha</button>
      </div>
      <p id="minha-senha-msg" class="form-msg"></p>
    </div>
  </div>

  <hr class="stitch" />

  <h2 style="margin-bottom:20px">Meus pedidos</h2>
  <p style="color:var(--gray); margin-top:-12px; margin-bottom:20px; font-size:14px">
    ⏳ Prazo de produção: até 15 dias úteis após a confirmação do pagamento.
  </p>
  <div id="lista-pedidos">
    <p class="empty-state">Carregando pedidos...</p>
  </div>
</div>

<div id="site-footer" class="site-footer"></div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script src="js/config.js"></script>
<script src="js/firebaseClient.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/cpf.js"></script>
<script src="js/auth.js"></script>
<script src="js/conta.js"></script>
<script>
  renderLayout("");
  initConta();
</script>
</body>
</html>
